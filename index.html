f-companion .leaf-request{min-width:0;width:100%;flex-basis:100%;font-size:12px}.leaf-companion .leaf-controls{gap:4px}.leaf-companion .leaf-budget{font-size:12px}}\n@keyframes leaf-companion-wave{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-7deg)}75%{transform:rotate(3deg)}}\n@media(prefers-reduced-motion:reduce){.leaf-companion .leaf-character svg{animation:none!important}}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cheader class=\"app-header\">\n    \u003ca class=\"brand\" href=\"#\" aria-label=\"Keimlabor\">\u003cspan class=\"brand-icon\">\u003csvg viewBox=\"0 0 32 32\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M16 27V16M16 18C7 19 4 12 5 6c8 0 12 5 11 12Zm0-3c0-7 5-11 12-10 0 7-5 11-12 10Z\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/span>\u003cspan>Keimlabor\u003csmall>GARTENKRESSE\u003c/small>\u003c/span>\u003c/a>\n    \u003cdiv class=\"header-actions\">\u003cbutton id=\"info-button\" class=\"text-button\" type=\"button\">Modellhinweise\u003c/button>\u003cbutton id=\"reset-button\" class=\"outline-button\" type=\"button\">\u003cspan aria-hidden=\"true\">↺\u003c/span> Neue Versuchsreihe\u003c/button>\u003c/div>\n  \u003c/header>\n  \u003cnav class=\"lab-navigation\" aria-label=\"Laborbereich\">\u003ca href=\"./index.html\" aria-current=\"page\">Keimungsversuch\u003c/a>\u003ca href=\"./bohnensamen.html\">Bohnensamen\u003c/a>\u003c/nav>\n  \u003cmain>\n    \u003csection class=\"intro\">\u003cdiv>\u003cp class=\"eyebrow\">DEIN EXPERIMENTIERTISCH\u003c/p>\u003ch1>Was braucht ein Samen?\u003c/h1>\u003cp class=\"subtitle\">6 Ansätze. Je 25 Kressesamen. Eine Woche Zeit.\u003c/p>\u003c/div>\u003cdiv class=\"phase-tag\" id=\"phase-tag\">\u003cspan class=\"status-dot\">\u003c/span>Vorbereitung\u003c/div>\u003c/section>\n    \u003cnav id=\"dish-tabs\" class=\"dish-tabs\" aria-label=\"Ansatz auswählen\">\u003c/nav>\n    \u003csection class=\"readiness\" id=\"readiness\">\u003cdiv>\u003cspan class=\"status-dot\">\u003c/span>\u003cstrong id=\"ready-count\">0 von 6 Ansätzen fertig\u003c/strong>\u003cspan class=\"ready-hint\">Sobald alle Ansätze fertig sind, beginnt die Woche automatisch.\u003c/span>\u003c/div>\u003cdiv id=\"ready-dots\" class=\"ready-dots\" aria-hidden=\"true\">\u003c/div>\u003c/section>\n    \u003csection id=\"cress-leaf\" class=\"cress-leaf\" aria-label=\"Blättchen begleitet den Versuch\">\u003c/section>\n    \u003csection id=\"workbench\" class=\"workbench\">\n      \u003cdiv class=\"experiment-view\">\n        \u003cdiv class=\"view-top\">\u003cdiv>\u003cp class=\"eyebrow\">PETRISCHALE \u003cspan id=\"dish-number\">01\u003c/span>\u003c/p>\u003ch2 id=\"dish-title\">Kontrolle\u003c/h2>\u003c/div>\u003cspan id=\"day-badge\" class=\"day-badge\">Tag 0\u003c/span>\u003c/div>\n        \u003cdiv id=\"dish-stage\" class=\"dish-stage\">\u003cdiv id=\"dish-canvas\">\u003c/div>\u003cdiv id=\"action-animation\" aria-hidden=\"true\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"dish-caption\">\u003cspan id=\"seed-caption\">Noch keine Samen eingelegt\u003c/span>\u003cspan id=\"place-caption\">Versuchstisch · 20 °C\u003c/span>\u003c/div>\n        \u003cdiv id=\"view-controls\" class=\"view-controls\" hidden>\u003cbutton type=\"button\" id=\"cover-button\" class=\"outline-button\" hidden>Abdeckung anheben\u003c/button>\u003cbutton type=\"button\" id=\"count-button\" class=\"outline-button\" aria-pressed=\"false\">Zählhilfe einschalten\u003c/button>\u003cbutton type=\"button\" id=\"compare-button\" class=\"text-button\">Alle Schalen vergleichen \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\u003c/div>\n        \u003cdiv id=\"count-bar\" class=\"count-bar\" hidden>\u003cspan>Von dir markiert: \u003cstrong id=\"manual-count\">0\u003c/strong> / 25\u003c/span>\u003cbutton type=\"button\" id=\"clear-marks\" class=\"text-button\">Markierungen löschen\u003c/button>\u003csmall>Tippe die Samenplätze an, die du zählen möchtest. Erneutes Tippen hebt die Markierung auf.\u003c/small>\u003c/div>\n        \u003cdiv id=\"action-status\" class=\"action-status\" role=\"status\" aria-live=\"polite\">\u003c/div>\n      \u003c/div>\n      \u003caside class=\"setup-panel\" id=\"setup-panel\" aria-labelledby=\"setup-title\">\n        \u003cdiv class=\"panel-heading\">\u003cp class=\"eyebrow\" id=\"panel-eyebrow\">MATERIAL & BEDINGUNGEN\u003c/p>\u003ch2 id=\"setup-title\">Ansatz zusammenstellen\u003c/h2>\u003c/div>\n        \u003cdiv id=\"setup-controls\">\n          \u003cfieldset>\u003clegend>\u003cspan>01\u003c/span> Unterlage\u003c/legend>\u003cdiv class=\"option-grid\">\u003cbutton type=\"button\" class=\"material-button\" data-action=\"soil\">\u003cspan class=\"material-symbol soil-symbol\" aria-hidden=\"true\">\u003c/span>\u003cstrong>Erde einfüllen\u003c/strong>\u003c/button>\u003cbutton type=\"button\" class=\"material-button\" data-action=\"cotton\">\u003cspan class=\"material-symbol cotton-symbol\" aria-hidden=\"true\">\u003c/span>\u003cstrong>Watte einlegen\u003c/strong>\u003c/button>\u003c/div>\u003c/fieldset>\n          \u003cfieldset>\u003clegend>\u003cspan>02\u003c/span> Samen & Wasser\u003c/legend>\u003cdiv class=\"option-grid\">\u003cbutton type=\"button\" class=\"material-button\" data-action=\"seeds\">\u003cspan class=\"material-symbol seeds-symbol\" aria-hidden=\"true\">\u003c/span>\u003cstrong>25 Samen einstreuen\u003c/strong>\u003c/button>\u003cbutton type=\"button\" class=\"material-button\" data-action=\"water\">\u003csvg class=\"water-symbol\" viewBox=\"0 0 40 40\" aria-hidden=\"true\">\u003cpath d=\"M20 3C17 10 9 18 9 25a11 11 0 0 0 22 0C31 18 23 10 20 3Z\" fill=\"#afd4df\" stroke=\"#558b9d\" stroke-width=\"1.4\"/>\u003cpath d=\"M15 24q-2 5 3 7\" fill=\"none\" stroke=\"white\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003c/svg>\u003cstrong>Wasser zugeben\u003c/strong>\u003c/button>\u003c/div>\u003cdiv class=\"water-state\">\u003cspan id=\"water-state\">Wasser: nicht zugegeben\u003c/span>\u003cbutton type=\"button\" id=\"remove-water\" class=\"tiny-button\" hidden>Entfernen\u003c/button>\u003c/div>\u003c/fieldset>\n          \u003cfieldset>\u003clegend>\u003cspan>03\u003c/span> Licht & Luft\u003c/legend>\u003cbutton type=\"button\" class=\"environment-button\" data-action=\"dark\" aria-pressed=\"false\">\u003cspan class=\"env-icon\" aria-hidden=\"true\">◐\u003c/span>\u003cspan>\u003cstrong id=\"dark-label\">Abdunkeln\u003c/strong>\u003csmall id=\"dark-sub\">Schale steht im Licht\u003c/small>\u003c/span>\u003cspan class=\"switch\" aria-hidden=\"true\">\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"environment-button\" data-action=\"oxygen\" aria-pressed=\"false\">\u003cspan class=\"env-icon air-icon\" aria-hidden=\"true\">≋\u003c/span>\u003cspan>\u003cstrong>Sauerstofffreie Kammer\u003c/strong>\u003csmall id=\"oxygen-sub\">Luft ist vorhanden\u003c/small>\u003c/span>\u003cspan class=\"switch\" aria-hidden=\"true\">\u003c/span>\u003c/button>\u003cp class=\"micro-note\">Die Kammer modelliert eine Umgebung ohne Sauerstoff.\u003c/p>\u003c/fieldset>\n          \u003cfieldset>\u003clegend>\u003cspan>04\u003c/span> Standort\u003c/legend>\u003cdiv class=\"location-options\">\u003cbutton type=\"button\" data-place=\"room\">\u003cspan aria-hidden=\"true\">▱\u003c/span>\u003cstrong>Tisch\u003c/strong>\u003csmall>20 °C\u003c/small>\u003c/button>\u003cbutton type=\"button\" data-place=\"fridge\">\u003cspan aria-hidden=\"true\">❄\u003c/span>\u003cstrong>Kühlschrank\u003c/strong>\u003csmall>5 °C\u003c/small>\u003c/button>\u003cbutton type=\"button\" data-place=\"warm\">\u003cspan aria-hidden=\"true\">♨\u003c/span>\u003cstrong>Wärmeplatte\u003c/strong>\u003csmall>25 °C\u003c/small>\u003c/button>\u003c/div>\u003cp class=\"micro-note\">Licht und Standort werden getrennt eingestellt.\u003c/p>\u003c/fieldset>\n        \u003c/div>\n        \u003cdiv id=\"result-settings\" hidden>\u003c/div>\n        \u003csection id=\"setup-hint\" class=\"setup-hint\" tabindex=\"-1\" aria-labelledby=\"hint-title\" hidden>\u003cp class=\"eyebrow\">DENKANSTOSS ZUM AUFBAU\u003c/p>\u003ch3 id=\"hint-title\">Noch einmal vergleichen\u003c/h3>\u003cp id=\"hint-text\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/p>\u003cdiv class=\"hint-actions\">\u003cbutton type=\"button\" id=\"next-hint\" class=\"hint-button\">Noch ein Tipp\u003c/button>\u003cbutton type=\"button\" id=\"hint-compare\" class=\"text-button\">Mit Kontrolle vergleichen\u003c/button>\u003c/div>\u003c/section>\n        \u003cdiv class=\"setup-footer\">\u003cbutton type=\"button\" id=\"ready-button\" class=\"primary-button\">Ansatz fertig\u003c/button>\u003cp id=\"ready-help\">Sind alle Bedingungen eingestellt?\u003c/p>\u003cbutton type=\"button\" id=\"empty-dish\" class=\"text-button\">Schale leeren\u003c/button>\u003c/div>\n      \u003c/aside>\n    \u003c/section>\n    \u003csection id=\"timelapse\" class=\"timelapse\" hidden>\n      \u003cdiv class=\"timeline-heading\">\u003cdiv>\u003cp class=\"eyebrow\">EINE WOCHE IM ZEITRAFFER\u003c/p>\u003ch2 id=\"time-title\">Tag 1\u003c/h2>\u003c/div>\u003cbutton type=\"button\" id=\"pause-button\" class=\"outline-button\">Zeitraffer pausieren\u003c/button>\u003c/div>\n      \u003cdiv class=\"timeline\" id=\"timeline\">\u003c/div>\n      \u003cdiv class=\"watering-notice\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M12 2C10 7 5 11 5 16a7 7 0 0 0 14 0c0-5-5-9-7-14Z\" fill=\"currentColor\"/>\u003c/svg>\u003cdiv>\u003cstrong id=\"watering-title\">Die Ansätze werden täglich versorgt.\u003c/strong>\u003cp>Angefeuchtete Schalen werden nachgegossen. Trocken angesetzte Schalen bleiben trocken.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv id=\"time-dishes\" class=\"time-dishes\">\u003c/div>\n    \u003c/section>\n    \u003cfooter class=\"app-footer\">\u003cspan>\u003ci aria-hidden=\"true\">\u003c/i>Vereinfachtes biologisches Modell · Reale Versuche können abweichen.\u003c/span>\u003cspan>\u003cem>Lepidium sativum\u003c/em> · Gartenkresse\u003c/span>\u003c/footer>\n  \u003c/main>\n  \u003cdialog id=\"info-dialog\">\u003cdiv class=\"dialog-top\">\u003ch2>Zum Modell\u003c/h2>\u003cbutton type=\"button\" class=\"close-dialog\" data-close=\"info-dialog\" aria-label=\"Modellhinweise schließen\">×\u003c/button>\u003c/div>\u003cdiv class=\"dialog-content\">\u003cp>Diese Umgebung ist eine Simulation. Die gezeigten Keimzahlen und die Entwicklung während der sieben Tage sind didaktische Modellannahmen, keine Vorhersage für eine bestimmte Saatgutpackung.\u003c/p>\u003cp>Erde und Watte sind beim Einfüllen trocken. Eine Wasserzugabe feuchtet die Unterlage an; im Zeitraffer wird diese Feuchtigkeit täglich erhalten. Ohne Wasserzugabe bleibt die Schale trocken.\u003c/p>\u003cp>Die sauerstofffreie Kammer ist eine besondere Modellbedingung. Ein geschlossener Petrischalendeckel allein wäre nicht sauerstofffrei. In der Simulation erfolgt die Versorgung dieser Kammer über einen geschlossenen Zugang mit sauerstofffreiem Wasser.\u003c/p>\u003cp>Der Kühlschrank verändert hier nur die Temperatur. Auch dort bleiben die gewählten Lichtbedingungen erhalten. Im Dunkelansatz bleibt die Abdeckung beim Nachgießen geschlossen.\u003c/p>\u003cp>Ein sichtbarer Wurzelaustritt gilt als Keimung. Die Zählhilfe markiert ausschließlich deine Auswahl; sie bewertet sie nicht.\u003c/p>\u003cp>Beim Verlassen wird der Arbeitsstand nach Möglichkeit in diesem Browser gespeichert. Es werden keine Ergebnisse an eine Lehrkraft übertragen.\u003c/p>\u003ch3>Fachliche Grundlagen\u003c/h3>\u003cul>\u003cli>\u003ca href=\"https://www.saps.org.uk/teaching-resources/resources/756/using-cress-in-the-lab/\" target=\"_blank\" rel=\"noopener noreferrer\">Science & Plants for Schools: Using Cress in the Lab\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://orgprints.org/id/eprint/29444/\" target=\"_blank\" rel=\"noopener noreferrer\">JLU Gießen / IGZ: Forschungsbericht zur Gartenkresse, 2015\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://doi.org/10.1104/pp.110.169706\" target=\"_blank\" rel=\"noopener noreferrer\">Morris et al.: Regulation of Seed Germination in Lepidium sativum, 2011\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/dialog>\n  \u003cdialog id=\"compare-dialog\" class=\"compare-dialog\">\u003cdiv class=\"dialog-top\">\u003cdiv>\u003cp class=\"eyebrow\">TAG 7\u003c/p>\u003ch2>Alle sechs Ansätze\u003c/h2>\u003c/div>\u003cbutton type=\"button\" class=\"close-dialog\" data-close=\"compare-dialog\" aria-label=\"Vergleich schließen\">×\u003c/button>\u003c/div>\u003cdiv id=\"compare-grid\" class=\"compare-grid\">\u003c/div>\u003c/dialog>\n  \u003cdialog id=\"reset-dialog\" class=\"small-dialog\">\u003cdiv class=\"dialog-top\">\u003ch2>Neu beginnen?\u003c/h2>\u003cbutton type=\"button\" class=\"close-dialog\" data-close=\"reset-dialog\" aria-label=\"Abbrechen\">×\u003c/button>\u003c/div>\u003cdiv class=\"dialog-content\">\u003cp>Die sechs Ansätze und deine Zählmarkierungen werden geleert.\u003c/p>\u003cdiv class=\"dialog-actions\">\u003cbutton type=\"button\" class=\"outline-button\" data-close=\"reset-dialog\">Abbrechen\u003c/button>\u003cbutton type=\"button\" class=\"primary-button\" id=\"confirm-reset\">Neue Versuchsreihe\u003c/button>\u003c/div>\u003c/div>\u003c/dialog>\n  \u003cdialog id=\"setup-compare-dialog\">\u003cdiv class=\"dialog-top\">\u003cdiv>\u003cp class=\"eyebrow\">DEINE GEWÄHLTEN EINSTELLUNGEN\u003c/p>\u003ch2>Mit der Kontrolle vergleichen\u003c/h2>\u003c/div>\u003cbutton type=\"button\" class=\"close-dialog\" data-close=\"setup-compare-dialog\" aria-label=\"Einstellungsvergleich schließen\">×\u003c/button>\u003c/div>\u003cdiv class=\"dialog-content\">\u003cp>Gehe die Bedingungen Zeile für Zeile durch. Welche Unterschiede gehören zu deiner Versuchsfrage?\u003c/p>\u003cdiv class=\"settings-compare-scroll\">\u003ctable class=\"settings-compare\">\u003cthead>\u003ctr>\u003cth scope=\"col\">Bedingung\u003c/th>\u003cth scope=\"col\">Kontrolle\u003c/th>\u003cth scope=\"col\" id=\"compare-setup-name\">Dein Ansatz\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"settings-compare-body\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"dialog-actions\">\u003cbutton type=\"button\" class=\"primary-button\" data-close=\"setup-compare-dialog\">Weiter am Ansatz arbeiten\u003c/button>\u003c/div>\u003c/div>\u003c/dialog>\n  \u003cscript>\n/*\n * Kresse · Keimlabor: deterministic teaching model, not measured prediction.\n * Exact counts and the compressed growth schedule are didactic assumptions.\n * UMD: window.CressModel in a browser; module.exports for the model checks.\n */\n(function (root, factory) {\n  'use strict';\n  var api = factory();\n  if (typeof module === 'object' && module.exports) module.exports = api;\n  else root.CressModel = api;\n}(typeof globalThis !== 'undefined' ? globalThis : this, function () {\n  'use strict';\n\n  var DISHES = [\n    ['control', 'Kontrolle'], ['water', 'Wasser'], ['soil', 'Erde'],\n    ['air', 'Luft'], ['light', 'Licht'], ['heat', 'Wärme']\n  ];\n  var SEED_COUNT = 25;\n  var COLD_INDICES = [1, 4, 7, 10, 13, 16, 19, 22];\n\n  function initialDishes() {\n    return DISHES.map(function (entry) {\n      return {\n        id: entry[0], name: entry[1], medium: null, water: false,\n        seeds: false, oxygen: true, dark: false, place: 'room',\n        ready: false, day: 0, marked: [], results: null\n      };\n    });\n  }\n\n  function clamp(value, lower, upper) {\n    return Math.max(lower, Math.min(upper, value));\n  }\n\n  function cleanDay(day) {\n    return typeof day === 'number' && Number.isFinite(day) ? clamp(day, 0, 7) : 0;\n  }\n\n  function isRecord(value) {\n    return value !== null && typeof value === 'object' && !Array.isArray(value);\n  }\n\n  function resultFor(dish, day) {\n    if (!isRecord(dish) || dish.seeds !== true) return [];\n    var elapsed = arguments.length \u003c 2 ? 7 : cleanDay(day);\n    var wet = dish.water === true;\n    var oxygen = dish.oxygen === true;\n    var cold = dish.place === 'fridge';\n    var warmth = dish.place === 'warm' ? 1.12 : 1;\n    var dark = dish.dark === true;\n\n    return Array.from({ length: SEED_COUNT }, function (_, index) {\n      var result = { index: index, stage: 'seed', vigor: 0, etiolated: dark };\n      if (elapsed === 0 || !wet) return result;\n      result.stage = 'swollen';\n      result.vigor = Math.min(1, elapsed) * 0.12;\n      if (!oxygen || index === 24) return result;\n\n      if (cold) {\n        var rank = COLD_INDICES.indexOf(index);\n        if (rank \u003c 0) return result;\n        var coldOnset = 2.4 + rank * 0.6;\n        if (elapsed >= coldOnset) {\n          result.stage = 'root';\n          result.vigor = clamp(0.07 + (elapsed - coldOnset) * 0.035, 0.07, 0.23);\n        }\n        return result;\n      }\n\n      // The deterministic spread gives individually visible stages without\n      // introducing different seed lots into comparisons between conditions.\n      var onset = 1.4 + ((index * 7) % 11) * 0.055;\n      var growth = (elapsed * warmth - onset) / (7 - onset);\n      if (growth \u003c= 0) return result;\n      result.vigor = clamp(growth, 0.035, 1);\n      result.stage = growth \u003c 0.25 ? 'root' : 'sprout';\n      return result;\n    });\n  }\n\n  function sanitizeDish(value, index) {\n    var position = Number.isInteger(index) && index >= 0 && index \u003c DISHES.length ? index : 0;\n    var fallback = initialDishes()[position];\n    if (!isRecord(value)) return fallback;\n    fallback.medium = value.medium === 'soil' || value.medium === 'cotton' ? value.medium : null;\n    fallback.water = value.water === true;\n    fallback.seeds = value.seeds === true;\n    fallback.oxygen = value.oxygen !== false;\n    fallback.dark = value.dark === true;\n    fallback.place = ['room', 'fridge', 'warm'].indexOf(value.place) !== -1 ? value.place : 'room';\n    fallback.day = cleanDay(value.day);\n    fallback.ready = value.ready === true && fallback.seeds && fallback.medium !== null;\n    if (fallback.seeds && Array.isArray(value.marked)) {\n      fallback.marked = Array.from(new Set(value.marked.filter(function (n) {\n        return Number.isInteger(n) && n >= 0 && n \u003c SEED_COUNT;\n      }))).slice(0, SEED_COUNT);\n    }\n    // Never trust stored result arrays: compute them from the stored setup.\n    fallback.results = fallback.seeds && fallback.day > 0 ? resultFor(fallback, fallback.day) : null;\n    return fallback;\n  }\n\n  function sanitizeDishes(value) {\n    if (!Array.isArray(value) || value.length !== DISHES.length) return initialDishes();\n    // Canonical identities prevent duplicated/mislabelled reference dishes.\n    return DISHES.map(function (entry, index) {\n      var matching = value.find(function (item) { return isRecord(item) && item.id === entry[0]; });\n      return sanitizeDish(matching, index);\n    });\n  }\n\n  function validDish(dish) {\n    return isRecord(dish) && DISHES.some(function (entry) { return entry[0] === dish.id; }) &&\n      (dish.medium === null || dish.medium === 'soil' || dish.medium === 'cotton') &&\n      typeof dish.water === 'boolean' && typeof dish.seeds === 'boolean' &&\n      typeof dish.oxygen === 'boolean' && typeof dish.dark === 'boolean' &&\n      typeof dish.ready === 'boolean' && ['room', 'fridge', 'warm'].indexOf(dish.place) !== -1 &&\n      typeof dish.day === 'number' && Number.isFinite(dish.day) && dish.day >= 0 && dish.day \u003c= 7 &&\n      Array.isArray(dish.marked) && dish.marked.length \u003c= SEED_COUNT &&\n      new Set(dish.marked).size === dish.marked.length && dish.marked.every(function (n) {\n        return Number.isInteger(n) && n >= 0 && n \u003c SEED_COUNT;\n      });\n  }\n\n  function readyToRun(dishes) {\n    return Array.isArray(dishes) && dishes.length === DISHES.length &&\n      new Set(dishes.map(function (dish) { return dish && dish.id; })).size === DISHES.length &&\n      dishes.every(function (dish) {\n        return validDish(dish) && dish.r panion .leaf-controls{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:7px}\n.leaf-companion .leaf-request{background:#355b3a;border-color:#355b3a;color:#fffef4;flex:1;min-width:145px}\n.leaf-companion .leaf-request:hover:not(:disabled){background:#496d42}\n.leaf-companion .leaf-history{display:flex;align-items:center;gap:5px}\n.leaf-companion .leaf-history button{padding:6px;font-size:19px;width:44px}\n.leaf-companion .leaf-position{min-width:34px;text-align:center;font-size:12px}\n.leaf-companion .leaf-budget{display:block;margin-top:5px;color:#5d7151;font-size:12px;line-height:1.35}\n.leaf-companion .leaf-close{width:44px;height:44px;align-self:start;padding:0;border:0;background:transparent;font-size:26px;font-weight:400}\n.leaf-companion[data-kind=\"warning\"]{border-color:#c78671;background:#fff3e9}\n.leaf-companion[data-kind=\"warning\"] .leaf-speech{border-color:#d4a08b;background:#fffaf3;color:#913d2e}\n.leaf-companion[data-kind=\"warning\"] .leaf-budget{color:#826453}\n.leaf-companion[data-kind=\"greeting\"] .leaf-character svg{animation:leaf-companion-wave .45s ease-out 1;transform-origin:50% 90%}\n.leaf-companion.leaf-side-panel{grid-template-columns:minmax(0,1fr) 44px;align-items:start}\n.leaf-companion.leaf-side-panel .leaf-character{grid-column:1;grid-row:1;width:177px;height:177px;justify-self:center}\n.leaf-companion.leaf-side-panel .leaf-speech{grid-column:1/-1;grid-row:2}\n.leaf-companion.leaf-side-panel .leaf-close{grid-column:2;grid-row:1}\n@media(max-width:560px){.leaf-companion{grid-template-columns:110px minmax(0,1fr);gap:4px;padding:4px;align-items:start}.leaf-companion .leaf-speech{padding:8px}.leaf-companion .leaf-close{grid-column:1;grid-row:2;justify-self:center}.leaf-companion .leaf-character{grid-column:1;grid-row:1}.leaf-companion .leaf-speech{grid-column:2;grid-row:1/3}.leaf-companion .leaf-request{min-width:0;width:100%;flex-basis:100%;font-size:12px}.leaf-companion .leaf-controls{gap:4px}.leaf-companion .leaf-budget{font-size:12px}}\n@keyframes leaf-companion-wave{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-7deg)}75%{transform:rotate(3deg)}}\n@media(prefers-reduced-motion:reduce){.leaf-companion .leaf-character svg{animation:none!important}}\n\n#bean-leaf{margin:0 0 12px}\n@media(min-width:701px) and (max-height:850px){.bean-app{padding-top:12px}.heading{margin-bottom:10px}.stage{height:clamp(310px,43vh,390px)}.tools{padding-top:14px;padding-bottom:14px}.tools .group-label{margin-top:12px}.tool-tip{margin-top:10px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cnav class=\"lab-nav\" aria-label=\"Labor auswählen\">\u003ca href=\"./index.html\">Keimungsversuch\u003c/a>\u003ca href=\"./bohnensamen.html\" aria-current=\"page\">Bohnensamen\u003c/a>\u003c/nav>\n\u003cmain class=\"bean-app\">\n \u003cheader class=\"heading\">\u003cdiv>\u003cp class=\"eyebrow\">DEIN PRÄPARATIONSTISCH\u003c/p>\u003ch1>Ein Bohnensamen\u003c/h1>\u003cp class=\"subtitle\">Feuerbohne · gequollener Samen\u003c/p>\u003c/div>\u003cdiv class=\"heading-actions\">\u003cbutton class=\"outline\" id=\"reset\" type=\"button\">↺ Neuer Samen\u003c/button>\u003c/div>\u003c/header>\n \u003csection id=\"bean-leaf\" aria-label=\"Blättchen begleitet die Präparation\">\u003c/section>\n \u003cdiv id=\"notice\" class=\"notice\" role=\"alert\" hidden>\u003cspan id=\"notice-text\">\u003c/span>\u003cbutton id=\"notice-close\" type=\"button\" aria-label=\"Hinweis schließen\">×\u003c/button>\u003c/div>\n \u003csection class=\"layout\" aria-label=\"Präparation eines Bohnensamens\">\n \u003cdiv class=\"work-area\">\u003cdiv class=\"work-head\">\u003ch2>Arbeitsfläche\u003c/h2>\u003cspan id=\"tool-badge\" class=\"tool-badge\">Hand\u003c/span>\u003c/div>\u003cdiv id=\"stage\" class=\"stage\" data-tool=\"hand\">\u003csvg id=\"scene\" viewBox=\"0 0 1000 570\" role=\"group\" aria-label=\"Arbeitsfläche mit den bereitgelegten Proben\">\u003c/svg>\u003cdiv id=\"gesture-note\" class=\"gesture-note\" hidden>\u003c/div>\u003cdiv id=\"empty-note\" class=\"empty\">Ziehe Material aus dem Vorrat\u003cbr>auf deinen Tisch.\u003c/div>\u003c/div>\u003cdiv class=\"bench-caption\">\u003cspan id=\"selection-label\" class=\"selection\">Keine Probe ausgewählt\u003c/span>\u003cdiv class=\"context-actions\" id=\"context-actions\" hidden>\u003cbutton id=\"turn\" type=\"button\">Wenden\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n \u003caside class=\"tools\" aria-label=\"Material und Werkzeuge\">\u003cdiv>\u003cp class=\"group-label\">MATERIALVORRAT\u003c/p>\u003cdiv class=\"materials\">\u003cbutton type=\"button\" class=\"material\" id=\"add-bean\" aria-label=\"Gequollenen Bohnensamen auf den Tisch legen\">\u003csvg viewBox=\"0 0 45 40\" aria-hidden=\"true\">\u003cdefs>\u003cradialGradient id=\"miniBean\">\u003cstop stop-color=\"#c5a5bb\"/>\u003cstop offset=\"1\" stop-color=\"#755071\"/>\u003c/radialGradient>\u003c/defs>\u003cpath d=\"M31 4C20-3 5 7 6 23S24 42 34 33 24 24 29 17 40 11 31 4\" fill=\"url(#miniBean)\" stroke=\"#67435d\"/>\u003cpath d=\"m14 9 5 6m-8 6 6 4m5-18 5 3m-2 22 4-3\" stroke=\"#423047\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003c/svg>\u003cspan>Gequollene\u003cbr>Bohne\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"material\" id=\"add-dish\">\u003csvg viewBox=\"0 0 45 40\" aria-hidden=\"true\">\u003cellipse cx=\"22\" cy=\"23\" rx=\"19\" ry=\"10\" fill=\"#e0ecea88\" stroke=\"#8bada6\"/>\u003cpath d=\"M3 17v6c0 13 38 13 38 0v-6\" fill=\"#e5f0ed99\" stroke=\"#a1bbb3\"/>\u003cellipse cx=\"22\" cy=\"17\" rx=\"19\" ry=\"10\" fill=\"#f4f9f6aa\" stroke=\"#a1bbb3\"/>\u003c/svg>\u003cspan>Petrischale\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"material\" id=\"add-starch\">\u003csvg viewBox=\"0 0 45 40\" aria-hidden=\"true\">\u003cellipse cx=\"22\" cy=\"30\" rx=\"18\" ry=\"4\" fill=\"#74826b1c\"/>\u003cpath d=\"M6 28q6-2 7-9 4-8 8-7 7-4 10 7 2 8 9 10-17 7-34-1\" fill=\"#fff\" stroke=\"#d1d8c7\"/>\u003cpath d=\"m16 21 3-3m7 5 2 2m-15 1 2-1\" stroke=\"#d6d9ca\"/>\u003c/svg>\u003cspan>Stärkepulver\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"material\" id=\"add-bottle\">\u003csvg viewBox=\"0 0 45 40\" aria-hidden=\"true\">\u003cpath d=\"M17 3h12v7l6 5v21H10V15l7-5Z\" fill=\"#98612a\" stroke=\"#67451f\"/>\u003cellipse cx=\"23\" cy=\"3\" rx=\"6\" ry=\"2\" fill=\"#4d3620\"/>\u003cpath d=\"M13 19h19v13H13Z\" fill=\"#f6efd9\"/>\u003cpath d=\"M15 23h15m-15 4h15\" stroke=\"#907755\"/>\u003c/svg>\u003cspan>Iod-Lösung\u003c/span>\u003c/button>\u003c/div>\u003c/div>\n \u003cdiv>\u003cp class=\"group-label\">WERKZEUGE\u003c/p>\u003cdiv class=\"tool-grid\">\n \u003cbutton type=\"button\" class=\"tool\" data-tool=\"hand\" aria-pressed=\"true\">\u003csvg viewBox=\"0 0 48 36\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M13 30 7 20q-1-4 3-3l6 5V7q0-4 4-3v15-14q0-4 4-2v15-12q0-4 4-2v14-9q0-4 4-2v15q0 9-6 10Z\" fill=\"#e0c4a6\" stroke=\"#a78b71\" stroke-width=\"1.2\"/>\u003c/svg>\u003cspan>Hand\u003c/span>\u003c/button>\n\u003cbutton type=\"button\" class=\"tool\" data-tool=\"tweezers\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 48 36\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M40 4Q36 2 33 7L7 30M40 4Q43 7 37 12L13 33\" stroke=\"#79868a\" stroke-width=\"3.8\" stroke-linecap=\"round\"/>\u003cpath d=\"M38 5 11 28M40 7 16 30\" stroke=\"#dce4e4\" stroke-width=\"1.3\"/>\u003cpath d=\"m9 27 3 2m0-5 3 2m0-5 3 2\" stroke=\"#68777b\" stroke-width=\"1\"/>\u003c/svg>\u003cspan>Pinzette\u003c/span>\u003c/button>\n\n \u003cbutton type=\"button\" class=\"tool\" data-tool=\"split\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 48 36\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M19 5C6 1 5 28 18 30q-5-12 1-25M29 5c13-4 14 23 1 25 5-12-1-25\" fill=\"#e7dfb7\" stroke=\"#b9b088\"/>\u003cpath d=\"m17 17-10 0 3-3m-3 3 3 3m21-3h10l-3-3m3 3-3 3\" stroke=\"#5d785c\" stroke-width=\"1.4\"/>\u003c/svg>\u003cspan>Auseinander-\u003cbr>ziehen\u003c/span>\u003c/button>\n \u003cbutton type=\"button\" class=\"tool\" data-tool=\"loupe\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 48 36\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"m30 24 10 10\" stroke=\"#496350\" stroke-width=\"6\" stroke-linecap=\"round\"/>\u003ccircle cx=\"20\" cy=\"14\" r=\"12\" stroke=\"#637e6b\" stroke-width=\"3\" fill=\"#eaf6f477\"/>\u003cpath d=\"M12 11q1-6 8-6\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003c/svg>\u003cspan>Lupe\u003c/span>\u003c/button>\n \u003cbutton type=\"button\" class=\"tool\" data-tool=\"needle\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 48 36\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"m7 29 17-12\" stroke=\"#8c9b9b\" stroke-width=\"1.4\"/>\u003cpath d=\"m23 18 17-13\" stroke=\"#bd9a63\" stroke-width=\"7\" stroke-linecap=\"round\"/>\u003cpath d=\"m25 16 14-11\" stroke=\"#ddc79e\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003c/svg>\u003cspan>Präpariernadel\u003c/span>\u003c/button>\n \u003cbutton type=\"button\" class=\"tool\" data-tool=\"pipette\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 48 36\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"m13 26 16-16 5 5-17 16Z\" fill=\"#eff5ef\" stroke=\"#8d9c8d\"/>\u003cpath d=\"m29 8 6-5q4-2 6 3l-5 7Z\" fill=\"#3f4642\"/>\u003cpath d=\"m16 26 12-12\" stroke=\"#b68831\" stroke-width=\"2\"/>\u003cpath d=\"M11 29q-5 6 0 6 5 0 0-6\" fill=\"#b58429\"/>\u003c/svg>\u003cspan>Pipette\u003c/span>\u003c/button>\n \u003c/div>\u003cp id=\"tool-tip\" class=\"tool-tip\">Probe antippen und umlegen – oder mit der Hand direkt ziehen.\u003c/p>\u003cdetails class=\"keyboard-help\">\u003csummary>Ohne Ziehen bedienen\u003c/summary>\u003cp>Material auswählen und auf der Arbeitsfläche ablegen. Eine Probe mit Tab wählen: Leertaste greift, Pfeiltasten ziehen, erneute Leertaste lässt los. Escape bricht ab. Mit der Pipette die Flaschenöffnung wählen; danach eine Probe.\u003c/p>\u003cbutton id=\"keyboard-place\" type=\"button\">Gewähltes Material mittig ablegen\u003c/button>\u003c/details>\u003cp id=\"pipette-status\" class=\"pipette-status\" role=\"status\">Pipette: leer\u003c/p>\u003c/div>\u003c/aside>\n \u003c/section>\n\u003c/main>\u003cdiv id=\"drag-ghost\" class=\"tool-ghost\" hidden aria-hidden=\"true\">\u003c/div>\n\u003cdialog id=\"loupe-dialog\" class=\"loupe-dialog\">\u003cdiv class=\"dialog-head\">\u003ch2>Unter der Lupe\u003c/h2>\u003cbutton class=\"close\" type=\"button\" data-close=\"loupe-dialog\" aria-label=\"Lupe weglegen\">×\u003c/button>\u003c/div>\u003cdiv class=\"loupe-frame\" id=\"loupe-view\">\u003c/div>\u003cdiv class=\"loupe-foot\">\u003cspan id=\"loupe-caption\">\u003c/span>\u003cbutton class=\"outline\" type=\"button\" id=\"loupe-turn\">Wenden\u003c/button>\u003c/div>\u003c/dialog>\n\n\u003cdialog id=\"reset-dialog\" class=\"small-dialog\">\u003cdiv class=\"dialog-head\">\u003ch2>Neuen Samen bereitstellen?\u003c/h2>\u003cbutton class=\"close\" type=\"button\" data-close=\"reset-dialog\" aria-label=\"Abbrechen\">×\u003c/button>\u003c/div>\u003cdiv class=\"dialog-body\">\u003cp>Die Arbeitsfläche wird geleert. Präparation, Ritzspuren und Tropfen werden zurückgesetzt.\u003c/p>\u003cdiv class=\"dialog-actions\">\u003cbutton class=\"outline\" type=\"button\" data-close=\"reset-dialog\">Abbrechen\u003c/button>\u003cbutton class=\"primary\" type=\"button\" id=\"confirm-reset\">Neuer Samen\u003c/button>\u003c/div>\u003c/div>\u003c/dialog>\n\u003cscript id=\"bean-leaf-component\">\n/* Blättchen: presentation and hint history only; adapters own experiment state. */\n(function(scope){\n  'use strict';\n  const FIGURE = \"\u003csvg class=\\\"fs-leaf-character\\\" viewBox=\\\"0 0 126 126\\\" aria-hidden=\\\"true\\\" focusable=\\\"false\\\">\\n      \u003cellipse cx=\\\"66\\\" cy=\\\"117\\\" rx=\\\"38\\\" ry=\\\"5\\\" fill=\\\"#244b3020\\\"/>\\n      \u003cg fill=\\\"none\\\" stroke=\\\"#31563b\\\" stroke-width=\\\"4.4\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\">\\n        \u003cpath d=\\\"M54 92 48 109 36 111M77 91 84 108 96 110\\\"/>\\n        \u Keine Probe ausgewählt';\n  $('context-actions').hidden=!o; $('turn').hidden=!o||!['left','right'].includes(state.selected);\n  if(focused?.startsWith('sample-')) $(focused)?.focus({preventScroll:true});\n  save();\n}\nfunction selectTool(tool){state.tool=tool;carry=null;heldGrip=null;keyboardPoint=null;clearNotice();hideGesture();render();}\nfunction showLoupe(id){magnified=id;renderLoupe();$('loupe-dialog').showModal();}\nfunction renderLoupe(){\n  const o=state.objects[magnified];if(!o)return;\n  const vb=magnified==='axis'?'-53 -86 106 172':['coat','starch'].includes(magnified)?'-122 -90 244 180':'-132 -162 264 324';\n  $('loupe-view').innerHTML=`\u003csvg viewBox=\"${vb}\" role=\"img\" aria-label=\"Vergrößerte Ansicht: ${names[magnified]}\">${defs('l')}${specimen(magnified,o,'l')}\u003c/svg>`;\n  $('loupe-caption').textContent=names[magnified];$('loupe-turn').hidden=!['left','right'].includes(magnified);\n}\nfunction inDish(x,y,pos=state.dishPos){return state.dish&&((x-pos.x)/190)**2+((y-pos.y)/165)**2\u003c1;}\nfunction compartmentAt(p){if(!inDish(p.x,p.y))return null;return (p.y>=state.dishPos.y?2:0)+(p.x>=state.dishPos.x?1:0);}\nfunction compartmentCenter(index){return {x:state.dishPos.x+(index%2?84:-84),y:state.dishPos.y+(index>=2?73:-73)};}\nfunction safePoint(id,p){return {x:clamp(p.x,id==='axis'?45:105,id==='axis'?955:895),y:clamp(p.y,id==='axis'?78:135,id==='axis'?492:435)};}\nfunction moveSample(id,p){\n  const o=state.objects[id];if(!o)return false;\n  const q=safePoint(id,p), section=compartmentAt(q);\n  if(id==='bean'&&section!==null){notice('Der ganze Samen bleibt zum Präparieren auf dem freien Tisch.');return false;}\n  if(section!==null){\n    if(Object.entries(state.objects).some(([other,v])=>other!==id&&v.inside&&v.compartment===section)){\n      notice('Dieses Fach ist schon belegt. Wähle ein freies Fach.');return false;\n    }\n    Object.assign(o,compartmentCenter(section),{inside:true,compartment:section});\n  }else Object.assign(o,q,{inside:false,compartment:null});\n  state.selected=id;return true;\n}\nfunction overlapsWholeBean(pos){\n  const o=state.objects.bean;if(!o)return false;\n  return ((o.x-pos.x)/300)**2+((o.y-pos.y)/285)**2\u003c1;\n}\nfunction moveDish(p){\n  const target={x:clamp(p.x,215,785),y:clamp(p.y,185,375)};\n  if(overlapsWholeBean(target)){notice('Unter dem ganzen Samen muss die Tischfläche frei bleiben.');return false;}\n  state.dishPos=target;\n  for(const o of Object.values(state.objects)) if(o.inside&&o.compartment!==null) Object.assign(o,compartmentCenter(o.compartment));\n  return true;\n}\nfunction addMaterial(kind,p={x:300,y:280}){\n  clearNotice();\n  if(kind==='dish'){\n    if(state.dish)return false;\n    const target={x:clamp(p.x,215,785),y:clamp(p.y,185,375)};\n    if(overlapsWholeBean(target)){notice('Lege die Schale neben den Samen. Die Tischfläche darunter bleibt frei.');return false;}\n    state.dish=true;state.dishPos=target;\n  }else if(kind==='bottle'){\n    if(state.bottle)return false;\n    state.bottle=true;state.bottlePos={x:clamp(p.x,55,945),y:clamp(p.y,95,490)};\n  }else if(kind==='bean'&&state.beanStage===-1){\n    if(inDish(p.x,p.y)){notice('Lege den ganzen Samen auf den freien Tisch.');return false;}\n    state.beanStage=0;state.objects.bean=makeObject('bean');moveSample('bean',p);\n  }else if(kind==='starch'&&!state.starch){\n    state.objects.starch=makeObject('starch');\n    if(!moveSample('starch',p)){delete state.objects.starch;return false;}\n    state.starch=true;\n  }else return false;\n  carry=null;state.tool='hand';render();return true;\n}\nfunction mouthPosition(){return {x:state.bottlePos.x,y:state.bottlePos.y-65,rx:22,ry:15};}\nfunction tipInBottle(p){const m=mouthPosition();return state.bottle&&((p.x-m.x)/m.rx)**2+((p.y-m.y)/m.ry)**2\u003c=1;}\nfunction loadPipette(p){\n  if(!tipInBottle(p)){notice(state.bottle?'Die Pipettenspitze muss in die Flaschenöffnung gelangen.':'Stelle zuerst die Iod-Flasche auf den Tisch.');return false;}\n  if
